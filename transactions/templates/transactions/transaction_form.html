{% extends 'dashboard/base.html' %}
{% block title %}İşlem Ekle{% endblock %}
{% block page_title %}Yeni İşlem Ekle{% endblock %}

{% block extra_css %}
<style>
    .form-wrap { max-width: 720px; }
    .form-card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 28px; }
    .form-card-title { font-size: 1rem; font-weight: 700; margin-bottom: 20px; }
    .field-3 { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 16px; }
    .field-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
    .form-actions { display: flex; gap: 10px; justify-content: flex-end; margin-top: 28px; padding-top: 20px; border-top: 1px solid var(--border); }

    /* Type selector */
    .type-selector { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 20px; }
    .type-opt { display: none; }
    .type-lbl {
        border: 2px solid var(--border);
        border-radius: 12px;
        padding: 14px 18px;
        cursor: pointer;
        display: flex; align-items: center; gap: 12px;
        transition: border-color .15s, background .15s;
        font-weight: 600; font-size: .9rem; color: var(--sub);
    }
    .type-lbl .type-icon { width: 36px; height: 36px; border-radius: 9px; display: flex; align-items: center; justify-content: center; font-size: 1rem; }
    .type-opt:checked + .type-lbl { border-color: transparent; color: var(--text); }
    #type-purchase:checked + .type-lbl { background: rgba(245,158,11,.08); border-color: #d97706; color: #92400e; }
    #type-sale:checked + .type-lbl { background: rgba(59,130,246,.08); border-color: #3b82f6; color: #1e3a8a; }
    .lbl-purchase .type-icon { background: rgba(245,158,11,.12); color: #d97706; }
    .lbl-sale .type-icon { background: rgba(59,130,246,.12); color: #3b82f6; }

    @media (max-width:640px) { .field-3,.field-2 { grid-template-columns: 1fr; } .type-selector { grid-template-columns: 1fr; } }
</style>
{% endblock %}

{% block content %}
<div class="form-wrap">
    <div class="form-card">
        <div class="form-card-title"><i class="fas fa-plus-circle me-2" style="color:var(--primary-light);"></i>Yeni İşlem</div>
        <form method="post">
            {% csrf_token %}

            <!-- İşlem türü -->
            <div class="mb-4">
                <label class="form-label" style="display:block;margin-bottom:8px;">İşlem Türü</label>
                <div class="type-selector">
                    <div>
                        <input class="type-opt" type="radio" name="type" id="type-purchase" value="purchase" {% if selected_type == 'purchase' %}checked{% endif %} required>
                        <label class="type-lbl lbl-purchase" for="type-purchase">
                            <div class="type-icon"><i class="fas fa-arrow-down"></i></div>
                            <div>
                                <div>Alış</div>
                                <div style="font-size:.74rem;font-weight:400;opacity:.7;">Gübre, fide, boru…</div>
                            </div>
                        </label>
                    </div>
                    <div>
                        <input class="type-opt" type="radio" name="type" id="type-sale" value="sale" {% if selected_type == 'sale' %}checked{% endif %}>
                        <label class="type-lbl lbl-sale" for="type-sale">
                            <div class="type-icon"><i class="fas fa-arrow-up"></i></div>
                            <div>
                                <div>Satış</div>
                                <div style="font-size:.74rem;font-weight:400;opacity:.7;">Çilek, elma, kiraz…</div>
                            </div>
                        </label>
                    </div>
                </div>
            </div>

            <div class="field-2 mb-3">
                <div>
                    <label class="form-label">Cari Seç</label>
                    <select class="form-select" name="customer" required>
                        <option value="">— Cari seçin —</option>
                        {% for c in customers %}
                        <option value="{{ c.id }}">{{ c.name }}</option>
                        {% endfor %}
                    </select>
                </div>
                <div>
                    <label class="form-label">Ürün</label>
                    <select class="form-select" id="product" name="product" required>
                        <option value="">— Önce tür seçin —</option>
                    </select>
                </div>
            </div>

            <div class="field-3 mb-3">
                <div>
                    <label class="form-label">Miktar</label>
                    <input type="text" inputmode="decimal" id="quantity" name="quantity" class="form-control" value="1" required>
                </div>
                <div>
                    <label class="form-label">Birim</label>
                    <select name="unit" class="form-select" required>
                        <option value="adet" selected>Adet</option>
                        <option value="kg">Kg</option>
                        <option value="lt">Lt</option>
                        <option value="m">Metre</option>
                        <option value="paket">Paket</option>
                    </select>
                </div>
                <div>
                    <label class="form-label">Birim Fiyat (₺)</label>
                    <input type="text" inputmode="decimal" id="unit_price" name="unit_price" class="form-control" required>
                </div>
            </div>

            <div class="mb-2">
                <label class="form-label">Açıklama</label>
                <textarea name="description" class="form-control" placeholder="İşleme ait notlar…"></textarea>
            </div>

            <div class="form-actions">
                <a href="{% url 'dashboard' %}" class="btn-o"><i class="fas fa-times"></i> İptal</a>
                <button type="submit" class="btn-g"><i class="fas fa-save"></i> Kaydet</button>
            </div>
        </form>
    </div>
</div>
{% endblock %}

{% block extra_js %}
<script>
    const saleOpts     = [{v:'cilek',l:'Çilek'},{v:'elma',l:'Elma'},{v:'kiraz',l:'Kiraz'},{v:'seftali',l:'Şeftali'}];
    const purchaseOpts = [{v:'gubre',l:'Gübre'},{v:'fide',l:'Fide'},{v:'boru',l:'Boru'}];
    const productSel   = document.getElementById('product');
    const qtyInp       = document.getElementById('quantity');
    const priceInp     = document.getElementById('unit_price');
    const initType     = "{{ selected_type|default:'' }}";
    const initProd     = "{{ selected_product|default:'' }}";

    function fillProducts() {
        const checked = document.querySelector('input[name="type"]:checked');
        const type    = checked ? checked.value : '';
        const opts    = type === 'sale' ? saleOpts : type === 'purchase' ? purchaseOpts : [];
        productSel.innerHTML = opts.length ? '' : '<option value="">— Önce tür seçin —</option>';
        opts.forEach(o => {
            const el = document.createElement('option');
            el.value = o.v; el.textContent = o.l;
            productSel.appendChild(el);
        });
        if (initProd) productSel.value = initProd;
    }

    function fmtNum(el) {
        let v = el.value.replace(/\./g,'').replace(/,/g,'.');
        if (!v) return;
        const [i,d] = v.split('.');
        const fi = i.replace(/\B(?=(\d{3})+(?!\d))/g,'.');
        el.value = d !== undefined ? `${fi},${d}` : fi;
    }

    document.querySelectorAll('input[name="type"]').forEach(r => r.addEventListener('change', fillProducts));
    qtyInp.addEventListener('blur',   () => fmtNum(qtyInp));
    priceInp.addEventListener('blur', () => fmtNum(priceInp));

    document.querySelector('form').addEventListener('submit', function() {
        qtyInp.value   = qtyInp.value.replace(/\./g,'').replace(/,/g,'.');
        priceInp.value = priceInp.value.replace(/\./g,'').replace(/,/g,'.');
    });

    fillProducts();
</script>
{% endblock %}
